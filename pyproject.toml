[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdy"
version = "0.1.0"
description = "Policy evaluation harness for physical AI"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # rtamt's antlr4 runtime does not import on 3.13
license = {text = "Apache-2.0"}
authors = [{name = "DeepThought Infinity (DTI.ai)"}]
keywords = ["robotics", "safety", "verification", "signal temporal logic", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.24",
    "scipy>=1.10",
    "rtamt>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
sign = ["cryptography>=41"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
verdy = "verdy.cli:main"

[project.urls]
Homepage = "https://github.com/DTInfinityAI/Verdy"

[tool.setuptools.packages.find]
include = ["verdy*"]

[tool.setuptools.package-data]
"verdy.spec" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:typing.io is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B027"]  # optional hooks on abstract base classes are intentional
