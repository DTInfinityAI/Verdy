name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,sign,store]"
      - name: Lint
        run: ruff check .
      - name: Scan for committed credentials
        run: verdy secrets scan .
      - name: Ontology structure (at most 15 children per node)
        run: verdy ontology validate core
      - name: Rendered ontology skill is up to date
        run: verdy ontology render core -o skills/ontology-core --check
      - name: Test
        run: pytest
      - name: Example evaluation
        working-directory: examples/home_robot
        run: verdy run run_tuned.yaml --runs 300 -q || test $? -eq 3
